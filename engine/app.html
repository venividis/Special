<script>
/*═══════════════════════════════════════════════════════════════════════════
  INTACT · the console — engine/app.html

  THE SHELL. Deployable source: no bundler, no import, no external resource.
  tools/build-app.mjs inlines engine/app.css at the one stylesheet link marker
  below, minifies each bare script block separately, gzips the whole
  document and shards it into Engine; src/Renderer.sol serves it as the
  body of /token/<id>/live and of tokenURI's animation_url, after a
  state block the Catalog writes (one script, one object) and a loader that
  inflates this document and writes it over itself. The keccak of the
  minified bytes is Engine.engineHash(); the footer at the bottom of the
  page recomputes it from the bytes that actually ran (CONSOLE §8).

  Two script blocks, both at the end of <body> so every element exists when
  they run — a browser runs them where they are, the verify-site shim runs
  them in document order after mounting, and both agree only there.

    1 · THE CHAIN   the wallet library's chain half, from IPSEITY
                    engine/ipseity.html (working tree, lines 1866–2038,
                    2203–2210, 2322–2394): keccak, hex/utf8, EIP-55, the
                    ABI coder, units, EIP-712, ERC-6551. tools/selftest.mjs
                    lifts the slice between the two markers out of THIS
                    file and holds it against published vectors; its
                    keccak is recorded in docs/INVARIANTS.md F3. It touches
                    no DOM, no provider and no location, and ends by
                    publishing the names block 2 reads (15 today; the
                    slice defines 24) onto a one-shot INTACT.$lib.
    2 · THE SHELL   one IIFE: the first statement copies $lib into its
                    closure and deletes it. Mode, the chooser, the chain
                    gate, rights, the slab, Home, the QR, the loader, the
                    footer, and INTACT.ui — the whole surface a panel may
                    call (docs/CONSOLE.md §5).

  Rules this file keeps (each enforced by tools/build-app.mjs, tools/
  verify.mjs or tools/verify-site.mjs): every string from chain or user
  reaches the DOM through textContent; no innerHTML; no eval, no
  Function, no external src; no URL of any kind — no RPC, no explorer, no
  gateway host — the one host-shaped literal is the SVG namespace the QR
  needs; amounts are BigInt; nothing is stored but the picker's rdns;
  nothing at the top level of block 2 but the IIFE.

  1 · THE CHAIN

  Everything below this line is carried inside the token: the sponge, the
  encoder, the checksum, the two account derivations. A page that has to
  ask a library what a selector is cannot honestly claim to be on chain.
  The only name this block reads from outside is S, the state object; the
  only name it leaves behind is INTACT.$lib, and block 2 takes that away.
═══════════════════════════════════════════════════════════════════════════*/
const S = window.INTACT || {};
/*── keccak-256 (the Ethereum variant: 0x01 padding, not SHA-3's 0x06) ──*/
const K_RC = [
  0x0000000000000001n, 0x0000000000008082n, 0x800000000000808an, 0x8000000080008000n,
  0x000000000000808bn, 0x0000000080000001n, 0x8000000080008081n, 0x8000000000008009n,
  0x000000000000008an, 0x0000000000000088n, 0x0000000080008009n, 0x000000008000000an,
  0x000000008000808bn, 0x800000000000008bn, 0x8000000000008089n, 0x8000000000008003n,
  0x8000000000008002n, 0x8000000000000080n, 0x000000000000800an, 0x800000008000000an,
  0x8000000080008081n, 0x8000000000008080n, 0x0000000080000001n, 0x8000000080008008n];
const K_ROT = [0,1,62,28,27, 36,44,6,55,20, 3,10,43,25,39, 41,45,15,21,8, 18,2,61,56,14];
const M64 = (1n << 64n) - 1n;
const rotl64 = (x, n) => n === 0n ? x : ((x << n) | (x >> (64n - n))) & M64;

function keccakF(A){
  for(let r = 0; r < 24; r++){
    const Cc = new Array(5), D = new Array(5);
    for(let x = 0; x < 5; x++) Cc[x] = A[x] ^ A[x+5] ^ A[x+10] ^ A[x+15] ^ A[x+20];
    for(let x = 0; x < 5; x++) D[x] = Cc[(x+4) % 5] ^ rotl64(Cc[(x+1) % 5], 1n);
    for(let x = 0; x < 5; x++) for(let y = 0; y < 5; y++) A[x + 5*y] ^= D[x];
    const B = new Array(25);
    for(let x = 0; x < 5; x++) for(let y = 0; y < 5; y++)
      B[y + 5 * ((2*x + 3*y) % 5)] = rotl64(A[x + 5*y], BigInt(K_ROT[x + 5*y]));
    for(let x = 0; x < 5; x++) for(let y = 0; y < 5; y++)
      A[x + 5*y] = B[x + 5*y] ^ ((~B[(x+1) % 5 + 5*y] & M64) & B[(x+2) % 5 + 5*y]);
    A[0] ^= K_RC[r];
  }
}
function keccak256(bytes){
  const rate = 136;
  const A = new Array(25).fill(0n);
  const padLen = rate - (bytes.length % rate);
  const P = new Uint8Array(bytes.length + padLen);
  P.set(bytes);
  P[bytes.length] |= 0x01;
  P[P.length - 1] |= 0x80;
  for(let off = 0; off < P.length; off += rate){
    for(let i = 0; i < rate / 8; i++){
      let lane = 0n;
      for(let b = 7; b >= 0; b--) lane = (lane << 8n) | BigInt(P[off + i*8 + b]);
      A[i] ^= lane;
    }
    keccakF(A);
  }
  const out = new Uint8Array(32);
  for(let i = 0; i < 4; i++){
    let l = A[i];
    for(let b = 0; b < 8; b++){ out[i*8 + b] = Number(l & 0xffn); l >>= 8n; }
  }
  return out;
}

const utf8    = s => new TextEncoder().encode(s);
const toHex   = u => "0x" + Array.from(u, b => b.toString(16).padStart(2, "0")).join("");
const fromHex = h => {
  h = String(h).replace(/^0x/, ""); if(h.length % 2) h = "0" + h;
  const u = new Uint8Array(h.length / 2);
  for(let i = 0; i < u.length; i++) u[i] = parseInt(h.substr(i*2, 2), 16);
  return u;
};
const khex     = s => toHex(keccak256(utf8(s)));
const kbytes   = h => toHex(keccak256(fromHex(h)));
const selector = sig => khex(sig).slice(0, 10);

/*── EIP-55: every address this token prints can be checked by eye ──*/
function checksum(addr){
  const a = String(addr).replace(/^0x/, "").toLowerCase();
  if(!/^[0-9a-f]{40}$/.test(a)) throw new Error("not an address: " + addr);
  const h = khex(a).slice(2);
  let o = "0x";
  for(let i = 0; i < 40; i++) o += parseInt(h[i], 16) >= 8 ? a[i].toUpperCase() : a[i];
  return o;
}
const isAddr  = a => /^0x[0-9a-fA-F]{40}$/.test(String(a || "").trim());
const short   = a => a ? a.slice(0, 6) + " … " + a.slice(-4) : "—";

/*── ABI ────────────────────────────────────────────────────────────────*/
const pad  = h => String(h).replace(/^0x/, "").padStart(64, "0");
const padR = h => String(h).replace(/^0x/, "").padEnd(64, "0");
const isDyn = t => t === "bytes" || t === "string" || /\[\]$/.test(t);

function encWord(type, v){
  if(type === "address"){
    const a = String(v).trim();
    if(!isAddr(a)) throw new Error("bad address: " + a);
    return pad(a.slice(2).toLowerCase());
  }
  if(type === "bool") return pad(v === true || v === "true" || v === 1 || v === "1" ? "1" : "0");
  if(/^u?int\d*$/.test(type)){
    let n = BigInt(String(v).trim());
    if(n < 0n) n = (1n << 256n) + n;                     // two's complement
    return pad(n.toString(16));
  }
  if(/^bytes([1-9]|[12]\d|3[0-2])$/.test(type)) return padR(String(v));
  throw new Error("unsupported type: " + type);
}
function encDyn(type, v){
  if(type === "string" || type === "bytes"){
    const b = type === "string" ? utf8(String(v)) : fromHex(v);
    let body = "";
    for(let i = 0; i < b.length; i += 32){
      body += Array.from(b.subarray(i, i + 32), x => x.toString(16).padStart(2, "0"))
                   .join("").padEnd(64, "0");
    }
    return pad(b.length.toString(16)) + body;
  }
  const base = type.slice(0, -2);
  const arr  = Array.isArray(v) ? v : String(v).split(",").map(s => s.trim()).filter(Boolean);
  return pad(arr.length.toString(16)) + arr.map(x => encWord(base, x)).join("");
}
function encodeParams(types, values){
  let head = "", tail = "";
  const headLen = types.length * 32;
  for(let i = 0; i < types.length; i++){
    if(isDyn(types[i])){
      head += pad((headLen + tail.length / 2).toString(16));
      tail += encDyn(types[i], values[i]);
    } else head += encWord(types[i], values[i]);
  }
  return head + tail;
}
/* a human-readable signature is turned into calldata here, in the frame */
function encodeCall(sig, args){
  const m = String(sig).trim().match(/^([A-Za-z_$][\w$]*)\((.*)\)$/);
  if(!m) throw new Error("a signature looks like transfer(address,uint256)");
  const types = m[2].trim() ? m[2].split(",").map(s => s.trim()) : [];
  const canonical = m[1] + "(" + types.join(",") + ")";
  if(types.length !== args.length)
    throw new Error(types.length + " argument" + (types.length === 1 ? "" : "s") + " expected, " + args.length + " given");
  return { data: selector(canonical) + encodeParams(types, args), sig: canonical, types };
}

const word    = (hex, i) => String(hex).replace(/^0x/, "").substr(i * 64, 64);
const decUint = (hex, i = 0) => BigInt("0x" + (word(hex, i) || "0"));
const decInt  = (hex, i = 0) => { const v = decUint(hex, i); return v >= (1n << 255n) ? v - (1n << 256n) : v; };
const decAddr = (hex, i = 0) => checksum("0x" + word(hex, i).slice(24));
const decBool = (hex, i = 0) => decUint(hex, i) !== 0n;
function decString(hex){
  const h = String(hex).replace(/^0x/, "");
  if(h.length <= 128) return "";
  const off = Number(BigInt("0x" + h.substr(0, 64))) * 2;
  const len = Number(BigInt("0x" + h.substr(off, 64)));
  const b   = fromHex(h.substr(off + 64, len * 2));
  return new TextDecoder().decode(b);
}
/* some contracts answer name()/symbol() with a raw bytes32. accept both. */
function decStringLoose(hex){
  const h = String(hex).replace(/^0x/, "");
  if(!h) return "";
  if(h.length === 64){
    const b = fromHex(h).filter(x => x !== 0);
    return new TextDecoder().decode(new Uint8Array(b));
  }
  try { return decString(hex); } catch { return ""; }
}

/*── units ──────────────────────────────────────────────────────────────*/
function fmtUnits(v, dec = 18, prec = 6){
  v = BigInt(v);
  const neg = v < 0n; if(neg) v = -v;
  const base = 10n ** BigInt(dec);
  const whole = v / base;
  const frac = (v % base).toString().padStart(dec, "0").slice(0, prec).replace(/0+$/, "");
  /* never round a balance down to a flat zero — dust is still custody */
  if(v > 0n && whole === 0n && frac === "")
    return (neg ? ">-" : "<") + "0." + "0".repeat(prec - 1) + "1";
  return (neg ? "-" : "") + whole.toString() + (frac ? "." + frac : "");
}
function toUnits(s, dec = 18){
  const t = String(s).trim();
  if(!/^\d*\.?\d*$/.test(t) || t === "" || t === ".") throw new Error("not a number: " + s);
  const [w, f = ""] = t.split(".");
  if(f.length > dec) throw new Error("too many decimal places");
  return BigInt((w || "0") + f.padEnd(dec, "0"));
}

const REG_6551  = "0x000000006551c19487814612e58FE06813775758";
/* Two implementations, two salts, two accounts per token. The implementations
   are handed over in the state block rather than hardcoded, because this
   collection ships its own — pinning the reference implementation here would
   derive an address the token does not use. The salts are INTACT's two:
   keccak("intact.reach.v1") for the Reach and keccak("intact.grip.v1") for the
   Grip (src/lib/AccountBinding.sol REACH_SALT / GRIP_SALT), computed below by
   this page's own keccak rather than pasted in, so a keccak that drifted would
   derive a wrong account and agrees() would say so. */
const REACH_IMPL = String(S.reachImpl || "0x0000000000000000000000000000000000000000");
const GRIP_IMPL  = String(S.gripImpl  || "0x0000000000000000000000000000000000000000");

/*── EIP-712, computed here so the wallet's display can be checked ──────*/
function typeHash(primary, types){
  const seen = new Set();
  const collect = t => {
    if(seen.has(t) || !types[t]) return;
    seen.add(t);
    types[t].forEach(f => collect(f.type.replace(/\[\d*\]$/, "")));
  };
  collect(primary);
  const order = [primary, ...Array.from(seen).filter(t => t !== primary).sort()];
  return khex(order.map(t => t + "(" + types[t].map(f => f.type + " " + f.name).join(",") + ")").join(""));
}
function encodeData(primary, data, types){
  let enc = pad(typeHash(primary, types));
  for(const f of types[primary]){
    const v = data[f.name];
    if(f.type === "string")      enc += pad(khex(String(v)));
    else if(f.type === "bytes")  enc += pad(kbytes(v));
    else if(types[f.type])       enc += pad(kbytes("0x" + encodeData(f.type, v, types)));
    else if(/\[\d*\]$/.test(f.type)){
      const base = f.type.replace(/\[\d*\]$/, "");
      enc += pad(kbytes("0x" + (v || []).map(x => encWord(base, x)).join("")));
    }
    else enc += encWord(f.type, v);
  }
  return enc;
}
const hashStruct = (primary, data, types) => kbytes("0x" + encodeData(primary, data, types));
function domainSeparator(domain){
  const fields = [];
  if(domain.name != null)              fields.push({ name:"name", type:"string" });
  if(domain.version != null)           fields.push({ name:"version", type:"string" });
  if(domain.chainId != null)           fields.push({ name:"chainId", type:"uint256" });
  if(domain.verifyingContract != null) fields.push({ name:"verifyingContract", type:"address" });
  if(domain.salt != null)              fields.push({ name:"salt", type:"bytes32" });
  return hashStruct("EIP712Domain", domain, { EIP712Domain: fields });
}
const digest712 = (domain, primary, message, types) =>
  kbytes("0x1901" + pad(domainSeparator(domain)) + pad(hashStruct(primary, message, types)));

/*── ERC-6551: the token's two accounts, derived rather than requested ──*/
const REACH_SALT = khex("intact.reach.v1").slice(2);
const GRIP_SALT  = khex("intact.grip.v1").slice(2);

function derive6551(impl, salt){
  /* ERC-1167 minimal proxy with the 6551 footer, hashed per the registry's
     CREATE2 derivation: salt · chainId · tokenContract · tokenId          */
  const code = "0x3d60ad80600a3d3981f3363d3d373d3d3d363d73" + impl.slice(2).toLowerCase() +
               "5af43d82803e903d91602b57fd5bf3" +
               salt +
               pad(BigInt(S.chainId).toString(16)) +
               pad(String(S.hub).slice(2).toLowerCase()) +
               pad(BigInt(S.id).toString(16));
  const h = kbytes(code);
  const create2 = "0xff" + REG_6551.slice(2).toLowerCase() + salt + h.slice(2);
  return checksum("0x" + kbytes(create2).slice(-40));
}

/* The Reach — the hand that acts. */
function account6551(){ return derive6551(REACH_IMPL, REACH_SALT); }

/* The Grip — the hand that only closes. */
function grip6551(){ return derive6551(GRIP_IMPL, GRIP_SALT); }

/* Whether the address derived in this frame is the address the contract
   reports. It should never disagree; the point of asking is that a viewer
   which only reads what it is handed cannot tell a correct answer from a
   convenient one. */
function agrees(derived, reported){
  return /^0x[0-9a-fA-F]{40}$/.test(String(reported || "")) &&
         String(derived).toLowerCase() === String(reported).toLowerCase();
}
/*── end of the chain half ──*/
/*  Exactly what block 2 reads. The selftest proves the whole slice above
    from the SOURCE — all 23 names and agrees(), the two ERC-6551 vectors
    included — while the build keeps only what is referenced
    (compress.toplevel), so the EIP-712 hasher, decString, decStringLoose
    and the 6551 derivation are proven here and absent from the chain
    (H §3, cut rule 6). Measured: publishing the 24 names cost 2,705 B of
    gzip for this block; this list costs 1,900 — the whole document stood
    at 15,547 with the 24 and the ceiling is 15,000. A later unit that
    needs a dropped helper adds its name here and pays its bytes. */
window.INTACT.$lib = { keccak256, khex, kbytes, selector, checksum, encodeCall, encodeParams, utf8, toHex, fromHex, decUint, decAddr, fmtUnits, toUnits, isAddr };
</script>
<script>
/*═══════════════════════════════════════════════════════════════════════════
  2 · THE SHELL

  One IIFE. Block 1 published the chain half onto a one-shot
  window.INTACT.$lib; the first statement here copies it into this closure
  and deletes it, before `ready` resolves and before any panel is injected,
  so no Blob script ever finds a keccak, an encoder or a provider by name
  (CONSOLE §4; G′3 asserts it). Everything a panel may call is INTACT.ui
  and nothing else; everything the shell reads from the chain passes
  through one `rpc()` that throws the chain sentence unless the body says
  the chain is right — the gate is a property of the primitive, not of
  boot order (CONSOLE §2).

  Terser mangles this block's top level separately from block 1 and from
  every panel, so nothing here is reached by name from outside; the only
  names that survive are `window.INTACT` and the ids in the document. The
  prose is in the comments because the build strips them: a sentence here
  costs nothing on chain, a sentence in a string costs its bytes, and the
  byte budget (H §3) is the design force of this file.
═══════════════════════════════════════════════════════════════════════════*/
(() => {
  const S = window.INTACT, L = S.$lib; delete S.$lib;
  const D = document, B = D.body, $ = s => D.querySelector(s), $$ = s => [...D.querySelectorAll(s)];
  /* names only — no endpoint, no explorer, no gateway host, anywhere (D14). Id 0 is not a chain: it
     is what a failed eth_chainId leaves behind, and the crest says so instead of printing "chain 0" */
  const NAMES = { 0: "an unreachable chain", 1: "Ethereum", 10: "OP Mainnet", 8453: "Base", 84532: "Base Sepolia", 11155111: "Sepolia", 31337: "local" };
  const nameOf = id => NAMES[id] || "chain " + id;
  const CHAIN = Number(S.chainId), ID = Number(S.id || 0), R = S.rights || {};
  /*  Paths resolve from a base, never from the root (CONSOLE §10): on a
      path-based gateway the document sits at /<premises>:<chain>/token/<id>/live
      and a root-relative /panel/swap.js would leave this Premises. With no
      /token/ in the path (the collection page) the base is the path itself
      less its trailing slash, so a mint from /<premises>:<chain>/ stays home. */
  const PATH = location.pathname, TI = PATH.indexOf("/token/");
  const BASE = TI >= 0 ? PATH.slice(0, TI) : PATH.replace(/\/$/, "");
  const PREM = String(S.premises).toLowerCase(), TOKEN = "/token/" + ID + "/live";
  const WEB3 = "web3://" + PREM + ":" + CHAIN + TOKEN;
  const hexQ = n => "0x" + BigInt(n).toString(16);
  const pad = h => String(h).replace(/^0x/, "").padStart(64, "0"), padR = h => String(h).replace(/^0x/, "").padEnd(64, "0");
  /* always with the spaces around the ellipsis: an address printed without
     them reads as one word and gets copied wrong */
  const short = a => a && !/^0x0{40}$/i.test(a) ? a.slice(0, 6) + " … " + a.slice(-4) : "nobody";
  const nap = ms => new Promise(r => setTimeout(r, ms));
  const fire = (name, detail) => dispatchEvent(new CustomEvent(name, { detail }));
  const date = t => Number(t) ? new Date(Number(t) * 1e3).toISOString().replace("T", " ").slice(0, 16) + " UTC" : "none";
  const lower = s => String(s).toLowerCase(), em = e => String(e && e.message).slice(0, 160);

  /*── mode: decided before anything is read, written on the body (CONSOLE §1) ──*/
  let opaque = false;
  try { localStorage.getItem("intact"); } catch { opaque = true; }
  const AS = new URLSearchParams(location.search).get("as");
  const mode = opaque ? "viewer" : L.isAddr(AS) ? "session" : "console", viewer = mode === "viewer", sess = mode === "session";
  const KEY = sess ? L.checksum(AS) : null;
  B.dataset.mode = mode; B.dataset.rights = ""; B.dataset.chain = "";
  D.documentElement.style.setProperty("--h", ID * 137 % 360);
  /* removed from the tree, never merely hidden: the viewer has no gesture */
  if (viewer) { $("#connect").remove(); $("#switch").remove(); }
  const VIEWER = "nothing here can sign; open the console at " + WEB3;
  const NONE = "no wallet in this browser; everything above is still true";
  const SESSION = "a session speaks only through the Reach", OPER = "an operator may move the token, not speak";
  const GUARD = "a guardian may pause, panic, seal and revoke sessions; nothing else";
  const KEYED = "this page acts as key " + KEY;

  /*── furniture: every text node through textContent ──*/
  const el = (tag, cls, text) => { const e = D.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const kv = (p, k, v) => { const d = el("div", "kv"); d.append(el("span", "k", k), el("span", "v", v)); p.append(d); return d; };
  const button = (p, label, grey, fn) => { const b = el("button", "b" + (grey ? " g" : ""), label); b.type = "button"; b.addEventListener("click", fn); p.append(b); return b; };
  const field = (p, label, ph) => { p.append(el("div", "k", label)); const i = el("input"); i.type = "text"; i.placeholder = ph || ""; i.autocomplete = "off"; p.append(i); return i; };

      return propose({ to: reach ? S.reach : st.token, data: reach ? buildData("reach.execute", [st.token, 0, data, 0]) : data, sig: reach ? EXEC : APPROVE, spend: true, need: reach ? R.HOLD : 0,
        lines: [["Lets", "the market pull exactly " + amt], ["Never", "unlimited"], ["Then", "press the same button again"]],
        sentence: "lets " + short(st.spender) + " pull exactly " + amt + " from " + (reach ? "the Reach" : short(account)) + ", and nothing more" });
    }
    return fin();
  }

  /*── Home: the baked facts first, live ones after receipts; a clear bit has two spellings ──*/
  function home() {
    $("#ident").textContent = ID ? "INTACT #" + ID : "INTACT";
    $("#c-chain-v").textContent = nameOf(CHAIN);
    const f = $("#facts"); f.replaceChildren();
    const fact = (k, v, label) => { kv(f, label || k, v).lastChild.dataset.fact = k; };
    if (ID) fact("id", ID, "intact");
    fact("chain", CHAIN);
    const M = S.ownedMarket, C = S.clocks || {}, status = F.status ? "Paused" : "Active";
    if (ID) {
      fact("holder", L.checksum(F.holder)); fact("epoch", epoch, "custody epoch"); fact("status", status); fact("locked", F.locked ? "yes" : "no");
      fact("reach", L.checksum(S.reach)); fact("grip", L.checksum(S.grip));
      fact("seal", C.sealedUntil ? "sealed until " + date(C.sealedUntil) : "none", "reach seal");
      fact("market", M == null ? "not reported" : !M.open ? "closed" : M.sealUntil > S.time ? "open · sealed until " + date(M.sealUntil) : "open");
      fact("fingerprint", S.fingerprint); fact("name", S.name || "—");
    } else { fact("minted", S.minted); fact("price", L.fmtUnits(BigInt(S.price || 0)) + " ETH"); }
    fact("engine", S.engineHash); fact("catalog", S.catalogHash); fact("block", S.block, "read at block");
    const ch = $("#chips"); ch.replaceChildren();
    if (ID) for (const name in S.bits) {
      const bit = S.bits[name], state = S.reported & bit ? "reported" : S.absent & bit ? "absent" : "unread";
      chip(ch, name + ": " + (state === "reported" ? state : state === "absent" ? "not deployed on this chain" : "could not be read at block " + S.block), state).dataset.bit = name;
    }
    const vw = $("#viewer"); vw.hidden = !ID;
    if (ID) {
      $("#viewer-note").textContent = viewer ? VIEWER : "";
      const a = $("#link-web3"); a.textContent = WEB3; a.href = WEB3;
      /* a TEMPLATE twin in the viewer, the placeholder visible; the real origin on a real origin */
      $("#link-https").textContent = opaque ? "https://<gateway>/" + PREM + ":" + CHAIN + TOKEN : location.origin + PATH;
      const q = $("#qr"); if (!q.firstChild) try { q.append(qr(WEB3)); } catch {}
    }
    $("#collection").hidden = !!ID;
    if (!ID) {
      const m = $("#mint"); m.replaceChildren(); m.append(el("h3", "", "mint"));
      act(m, "mint", "mint one for " + L.fmtUnits(BigInt(S.price || 0)) + " ETH", 0, mintFlow, { spend: true });
      const list = (id, title, items, cls, text, href) => {
        const d = $(id); d.replaceChildren(); d.append(el("h3", "", title));
        if (items == null) note(d, "could not be read at block " + S.block); else if (!items.length) note(d, "none yet");
        else for (const x of items) { const r = el(href ? "a" : "div", cls + " v", text(x)); if (href && !opaque) r.href = href(x); d.append(r); }
      };
      list("#directory", "open markets", S.open, "market", id => "#" + id, id => BASE + "/token/" + id + "/live");
      list("#recent", "recent coins", S.recent, "coin", L.checksum);
      list("#commons", "the commons", S.commons && [S.commons], "room", c => c.count + " said · last at block " + c.last);
    }
  }
  async function mintFlow() {
    let price;
    try { price = L.decUint(await hub("hub.price")); } catch { return say("the price could not be read; nothing is guessed", "err"); }
    const eth = L.fmtUnits(price) + " ETH";
    return propose({ to: S.hub, key: "hub.mint", args: [account], value: price, spend: true,
      lines: [["Mints", "one INTACT to " + short(account)], ["Price", eth + ", exactly"]],
      sentence: "mints one INTACT to " + account + " for exactly " + eth,
      then: r => { const lg = (r.logs || []).find(l => lower(l.address) === lower(S.hub) && l.topics && lower(l.topics[0]) === lower(S.topics.transfer) && !BigInt(l.topics[1]));
        if (lg) location.href = BASE + "/token/" + BigInt(lg.topics[3]) + "/live"; } });
  }
  /* the live facts after a receipt: one coreOf read carries status (word 0), the lock count
     (word 2), the epoch (word 3) and the guardian hold (word 7) — static words, read as such */
  async function facts() {
    if (!ID || chain !== "ok") return;
    try {
      const h = (await hub("hub.coreOf", [ID])).slice(2), w = i => W(h, i * 32);
      F.status = Number(w(0)); F.locked = w(2) !== 0n || w(7) !== 0n; setEpoch(w(3));
    } catch {}
  }

  /*── session mode (D13): the key's own Home; every holder control hidden ──*/
  async function session() {
    const s = $("#session"); s.hidden = !sess; if (!sess) return;
    s.replaceChildren(); s.append(el("h3", "", "session"));
    note(s, KEYED + " for #" + ID);
    if (account && account !== KEY) note(s, KEYED + "; the connected wallet is " + account + " — connect the key's wallet", "bad");
    if (chain !== "ok") return note(s, gateSentence());
    try {
      /* sessionOf is fourteen static words (kind, expires, epoch, native cap, spent, uses left,
         interval, …, active at 13); sessionExposure is (native, (address,uint128)[]) — read as
         words, no type list to carry */
      const h = (await call(S.reach, buildData("reach.sessionOf", [KEY]))).slice(2), v = i => W(h, i * 32);
      note(s, (v(0) ? "recipe" : "allowlist") + " · expires " + date(v(1)) + " · granted at epoch " + v(2) + " · native cap " + L.fmtUnits(v(3)) + " ETH, spent " + L.fmtUnits(v(4)) + " · uses left " + (v(5) || "not capped") + " · interval " + v(6) + " s · " + (v(13) ? "active" : "inactive"));
      const x = (await call(S.reach, buildData("reach.sessionExposure", [KEY]))).slice(2);
      note(s, "worst-case exposure " + L.fmtUnits(W(x, 0)) + " ETH native, " + W(x, Number(W(x, 32))) + " asset cap(s)");
    } catch (e) { note(s, "grant not read: " + em(e), "bad"); }
    note(s, "SESSION right: " + (bits === null ? "not read" : bits & R.SESSION ? "yes" : "no"));
  }

  /*── the QR (D9, CONSOLE §13): byte mode, version 5-L, mask 0, built as SVG rects ──*/
  function qr(text) {
    const data = L.utf8(text); if (data.length > 106) throw RangeError("payload over 106 bytes");
    /* GF(2^8) over 0x11d; the generator ∏(x − α^i) for 26 EC codewords */
    const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
    for (let i = 0, x = 1; i < 255; i++) { EXP[i] = EXP[i + 255] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11d; }
    const mul = (a, b) => a && b ? EXP[LOG[a] + LOG[b]] : 0;
    let gen = [1]; for (let i = 0; i < 26; i++) { const g = Array(gen.length + 1).fill(0); gen.forEach((c, j) => { g[j] ^= c; g[j + 1] ^= mul(c, EXP[i]); }); gen = g; }
    /* mode 0100, count 8 bits, the bytes, terminator, pad to 108 codewords with 0xec 0x11 */
    const bits = [], put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >> i) & 1); };
    put(4, 4); put(data.length, 8); for (const b of data) put(b, 8); put(0, Math.min(4, 864 - bits.length)); while (bits.length % 8) bits.push(0);
    const cw = []; for (let i = 0; i < bits.length; i += 8) cw.push(parseInt(bits.slice(i, i + 8).join(""), 2));
    for (let p = 0xec; cw.length < 108; p ^= 0xfd) cw.push(p);
    const ec = Array(26).fill(0);
    for (const c of cw) { const f = c ^ ec.shift(); ec.push(0); if (f) for (let j = 0; j < 26; j++) ec[j] ^= mul(gen[j + 1], f); }
    const all = cw.concat(ec);
    /* the 37 × 37 matrix: function patterns first, then the zigzag, then mask 0 */
    const N = 37, M = new Uint8Array(N * N), FX = new Uint8Array(N * N);
    const setF = (x, y, v) => { if (x >= 0 && y >= 0 && x < N && y < N) { M[y * N + x] = v; FX[y * N + x] = 1; } };
    const square = (cx, cy, r, f) => { for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) setF(cx + dx, cy + dy, f(Math.max(Math.abs(dx), Math.abs(dy)))); };
    for (const [x, y] of [[3, 3], [N - 4, 3], [3, N - 4]]) square(x, y, 4, d => d <= 1 || d === 3 ? 1 : 0);
    /* format regions: nine around the top-left finder on each axis; eight on row 8 by the
       top-right finder, seven on column 8 above the bottom-left one (the dark module is the eighth) */
    for (let i = 0; i < 9; i++) { setF(i, 8, 0); setF(8, i, 0); if (i < 8) setF(N - 1 - i, 8, 0); if (i < 7) setF(8, N - 1 - i, 0); }
    for (let i = 8; i < N - 8; i++) { setF(i, 6, 1 - i % 2); setF(6, i, 1 - i % 2); }
    square(N - 7, N - 7, 2, d => d === 1 ? 0 : 1);
    setF(8, N - 8, 1);
    let bi = 0;
    for (let right = N - 1, k = 0; right >= 1; right -= 2, k++) {
      if (right === 6) right = 5;
      for (let i = 0; i < N; i++) { const y = k & 1 ? i : N - 1 - i; for (const x of [right, right - 1]) { const p = y * N + x; if (!FX[p]) { let b = bi < 1072 ? (all[bi >> 3] >> (7 - (bi & 7))) & 1 : 0; bi++; if (!((x + y) & 1)) b ^= 1; M[p] = b; } } }
    }
    /* format: L (01) ‖ mask 0 (000), BCH(15,5) over 0x537, masked with 0x5412 — 0x77c4 */
    let rem = 8; for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    const fm = (8 << 10 | rem) ^ 0x5412, bit = i => (fm >> i) & 1;
    for (let i = 0; i < 6; i++) setF(8, i, bit(i)); setF(8, 7, bit(6)); setF(8, 8, bit(7)); setF(7, 8, bit(8)); for (let i = 9; i < 15; i++) setF(14 - i, 8, bit(i));
    for (let i = 0; i < 8; i++) setF(N - 1 - i, 8, bit(i)); for (let i = 8; i < 15; i++) setF(8, N - 15 + i, bit(i));
    const NS = "http://www.w3.org/2000/svg", svg = D.createElementNS(NS, "svg"), attrs = (e, o) => { for (const k in o) e.setAttribute(k, o[k]); return e; };
    /* sized by #qr svg in app.css; every rect carries its own shape-rendering (CONSOLE §13) */
    attrs(svg, { viewBox: "0 0 45 45", role: "img", "aria-label": text });
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (M[y * N + x]) svg.append(attrs(D.createElementNS(NS, "rect"), { x: x + 4, y: y + 4, width: 1, height: 1, "shape-rendering": "crispEdges" }));
    return svg;
  }

  /*── the panel loader: bytes from the origin or from engine.panel(i), keccak'd against the pin,
       injected as a Blob script only then; a mismatch is a sentence, never a fallback ──*/
  const PANELS = Object.keys(S.panels || {}), LANES = ["home", ...PANELS], loading = new Set();
  /* one section per pinned panel (CONSOLE §6.1 #lane-<name>), derived from the same object as the
     nav rather than written six times in the markup — 17 B of gzip, paid towards the fix round */
  for (const n of PANELS) $("#lane").appendChild(el("section")).id = "lane-" + n;
  const canLoad = () => !opaque || !!PV;
  function paintNav() {
    const nav = $("#lanes"); nav.replaceChildren();
    for (const n of PANELS) {
      if (n === "agent" && S.absent & S.bits.agentcard) continue;
      const a = el("a", "", n); a.href = "#" + n; a.dataset.lane = n; if (!canLoad()) a.setAttribute("aria-disabled", "true"); nav.append(a);
    }
  }
  function show(name) {
    if (!LANES.includes(name)) name = "home";
    for (const n of LANES) { const s = $("#lane-" + n); if (s) s.classList.toggle("on", n === name); }
    for (const a of $$("#lanes a")) a.classList.toggle("on", a.dataset.lane === name);
    $("#lane").classList.toggle("on", name !== "home");
    if (name === "home") return;
    fire("intact:lane", { name });
    const lane = $("#lane-" + name);
    if (!lane.dataset.loaded && canLoad()) load(name, lane);
  }
  async function load(name, lane) {
    if (loading.has(name)) return; loading.add(name);
    const bad = t => lane.replaceChildren(el("p", "blurb bad", t));
    try {
      let bytes;
      if (!opaque) { const r = await fetch(BASE + "/panel/" + name + ".js"); if (!r.ok) throw Error("the origin answered " + r.status); bytes = new Uint8Array(await r.arrayBuffer()); }
      else bytes = L.fromHex(decode(["bytes"], await call(S.engine, buildData("engine.panel", [PANELS.indexOf(name)])))[0]);
      if (bytes[0] === 0x1f && bytes[1] === 0x8b) bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
      const h = L.toHex(L.keccak256(bytes)), want = lower(S.panels[name]);
      if (h !== want) return bad("panel refused: the chain pinned hash " + want + ", these bytes hash to " + h);
      lane.dataset.loaded = "1";
      const t = el("script"); t.src = URL.createObjectURL(new Blob([bytes], { type: "text/javascript" })); B.append(t);
    } catch (e) { bad("this lane could not be read: " + em(e)); }
    finally { loading.delete(name); }
  }

  /*── the self-hash footer (D3, CONSOLE §8): the bytes running here against the bytes the chain pins ──*/
  async function footer() {
    const v = $("#verified"), doc = S.$doc; delete S.$doc;
    const bad = t => { v.textContent = t; v.classList.add("bad"); }, self = t => { v.textContent = "self-consistent; " + t; };
    /* a loader that kept no bytes was altered — the one line the footer relies on is gone — and
       that is told in red, not as a shrug */
    const MIS = "does not match the engine hash";
    if (doc == null) return bad(MIS + "; the loader kept no bytes");
    const h = L.toHex(L.keccak256(L.utf8(doc))), DIFF = "this document names a different Premises than the address you opened";
    if (h !== lower(S.engineHash)) return bad(MIS);
    if (chain === "wrong") return self("wallet on " + nameOf(walletChain) + ", not this token's chain");
    if (chain !== "ok") return self("chain not reachable to verify");
    try {
      if (!viewer) {
        /* the one anchor the reader chose: the address in the URL must be this document's Premises,
           and that Premises must name this document's Engine, before the live hash counts */
        const m = (location.hostname + PATH).match(/0x[0-9a-f]{40}/i);
        if (m && (lower(m[0]) !== PREM || lower(L.decAddr(await call(S.premises, SEL("ENGINE()")))) !== lower(S.engine))) return bad(DIFF);
      }
      const live = lower(await call(S.engine, buildData("engine.engineHash"))), n = BigInt(await rpc("eth_blockNumber"));
      if (live.slice(0, 66) !== h) return bad(MIS);
      v.textContent = "engine " + short(L.checksum(S.engine)) + " pins these bytes at block " + n;
    } catch { self("chain not reachable to verify"); }
  }

  /*── INTACT.ui — the whole surface a panel may call (CONSOLE §5) ──*/
  const ALLOW = /^eth_(call|getLogs|getBalance|getBlockByNumber|blockNumber|getCode|getTransactionReceipt|chainId|accounts)$/;
  const view = raw => {
    const h = String(raw).replace(/^0x/, ""), at = i => Number(W(h, i * 32)), fits = i => at(i) % 32 === 0 && at(i) + 32 <= h.length / 2;
    return { raw, words: h.match(/.{64}/g) || [], w: i => W(h, i * 32), a: i => L.checksum("0x" + h.substr(i * 64 + 24, 40)), b: i => W(h, i * 32) !== 0n,
      s: i => fits(i) ? decVal("string", h, at(i)) : new TextDecoder().decode(L.fromHex(h.substr(i * 64, 64)).filter(x => x)),
      bytes: i => decVal("bytes", h, at(i)), arr: (i, t = "uint256") => decVal(t + "[]", h, at(i)), tuple: (i, types) => decSeq(types, h, isDyn("(" + types + ")") ? at(i) : i * 32) };
  };
  let readyRes; const ready = new Promise(r => { readyRes = r; });
  const ui = {
    ready, mode: () => mode, rights: () => bits, account: () => account, epoch: () => epoch, host: name => $("#lane-" + name),
    rows, data: buildData,
    read: async (to, key, args) => view(await call(to, buildData(key, args))),
    readAs: async (to, key, args, from) => view(await call(to, buildData(key, args), from)),
    request: (m, p) => ALLOW.test(m) ? rpc(m, p) : Promise.reject(Error("a panel cannot send; propose it")),
    sealSignature: async () => {
      const w = why(0); if (w || mode !== "console") throw Error(w || SESSION + "; " + KEYED);
      return rpc("personal_sign", [L.toHex(L.utf8("INTACT seal v1 · chain " + CHAIN + " · hub " + lower(S.hub))), account]);
    },
    simulate: async (to, data, o = {}) => {
      try { const p = { to, data }; if (o.from) p.from = o.from; if (o.value) p.value = hexQ(o.value); return { ok: true, data: await rpc("eth_call", [p, "latest"]), sentence: "" }; }
      catch (e) { const d = revertData(e); if (d == null) throw e; return { ok: false, data: d, sentence: errorSentence(d) }; }
    },
    errorSentence, propose, approveExactThen, act, gate,
    delegate: () => delegate, ackDelegate: () => { if (delegate) { delegate.acked = true; for (const b of $$("[data-spend]")) b.hidden = false; fire("intact:rights", { bits, account, epoch }); } },
    qr, el, kv, button, field, note, chip,
    /* every bytesN is left-aligned (B4 and B32 are one function); bytes and str are the length
       word and the padded body WITHOUT the offset word, so a panel laying a tuple or a nested
       array by hand places them at its own offset (CONSOLE §5) */
    enc: { W: v => pad(typeof v === "string" && v.startsWith("0x") ? v.slice(2) : BigInt(v).toString(16)), A: a => pad(lower(a).slice(2)), B4: padR, B32: padR,
           bytes: h => L.encodeParams(["bytes"], [h]).slice(64), str: s => L.encodeParams(["string"], [s]).slice(64), params: L.encodeParams },
    fmt: (v, d, p) => L.fmtUnits(v, d == null ? 18 : d, p == null ? 6 : p), parse: (s, d) => L.toUnits(s, d == null ? 18 : d), short, checksum: L.checksum, isAddr: L.isAddr, khex: L.khex, kbytes: L.kbytes,
    /* the chain's clock, or a rejection; never INTACT.time, never Date.now() */
    clock: async () => { try { return BigInt((await rpc("eth_getBlockByNumber", ["latest", false])).timestamp); } catch { throw Error("the chain's clock could not be read"); } },
    now: Date.now, say, walkLogs: filter => rpc("eth_getLogs", [filter])
  };
  S.ui = ui; S.loaded = S.loaded || {};

  /*── arrival ──*/
  /* the gesture: two or more announcers and nothing remembered → the picker first, then
     eth_requestAccounts on the wallet the person picked, and nothing on the others */
  const connect = async () => {
    if (P.size > 1 && !saved()) { const d = await ask(); if (!d) return; take(d); await checkChain(); if (chain !== "ok") return; }
    await learn(true); if (account && CHO) keep(CHO.info.rdns); await rights();
  };
  const c = $("#connect"), sw = $("#switch");
  if (c) c.addEventListener("click", connect);
  /* a switch that succeeds is heard as chainChanged, and that event already refreshed (the gate moved
     on it, CONSOLE §2); the resolved request refreshes only for a wallet that switched without saying so */
  if (sw) sw.addEventListener("click", () => PV && PV.request({ method: "wallet_switchEthereumChain", params: [{ chainId: hexQ(CHAIN) }] })
    .then(() => chain === "ok" || refresh(), e => say(e && e.code === 4902 ? "your wallet does not know " + nameOf(CHAIN) : "the switch was declined", "err")));
  /* clicking your own address drops the remembered choice and asks again (CONSOLE §2). With two or
     more announcers the page enters the dismissed state first — no provider, chain "none", rights
     null, the crest read-only, #connect shown, intact:rights fired with null bits — and stays there
     until the picker is answered, so no read reaches the wallet just dropped; with one announcer
     there is no picker and that wallet is simply asked again. The guard is the provider, not the
     account: once dropped there is no address to click, and a wallet on the wrong chain can still
     be exchanged. (Review, round two: nulling the account alone left rights at 1, #connect hidden,
     the crest naming the dropped wallet and every read still going to it.) */
  $("#c-wallet-v").addEventListener("click", () => { if (viewer || !PV) return; store(s => s.removeItem("intact.wallet")); account = null; if (P.size > 1) { CHO = PV = null; refresh(); } connect(); });
  addEventListener("hashchange", () => show(location.hash.slice(1)));
  addEventListener("keydown", e => { if (e.key === "Escape") closeSlab(); });
  (async () => {
    /* the shell's own rows, verified like a panel's: a baked selector this keccak disagrees with is a refusal */
    rows({ "hub.rightsOf": "rightsOf(uint256,address)", "hub.custodyEpoch": "custodyEpoch(uint256)", "hub.coreOf": "coreOf(uint256)", "hub.price": "price()", "hub.mint": "mint(address)",
           "engine.panel": "panel(uint256)", "engine.engineHash": "engineHash()", "catalog.knownDelegates": "knownDelegates()", "erc20.allowance": "allowance(address,address)",
           "erc20.approve": APPROVE, "reach.execute": EXEC, "reach.sessionOf": "sessionOf(address)", "reach.sessionExposure": "sessionExposure(address)" });
    home();
    if (viewer) { await instant(); PV = pv(); } else PV = await choose();
    wire(PV);
    await checkChain();
    paintNav();
    if (chain === "ok") await learn(false);
    await rights();
    readyRes();
    show(location.hash.slice(1));
    setTimeout(footer);
  })().catch(e => { say("the shell could not boot: " + em(e), "err"); readyRes(); });
})();
</script>
</body>
</html>
